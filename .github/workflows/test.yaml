name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
#     paths-ignore:
#       - '**.md'

jobs:
  build:
    name: Install deps ${{ matrix.os }}. Build only ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/cache@v6
        id: cache-node-modules
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build on ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: npm run build
      - name: Upload ubuntu build folders
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: build artifacts
          retention-days: 1
          path: |
            node/
            web/
            bundles/

  test:
    needs: build
    name: ${{ matrix.os }} with node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build artifacts
      - name: Use nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v6
        id: cache-node-modules
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: test
        run: npm test

  # Single stable check name for branch protection to require. Without this,
  # every matrix change renames the checks and the protection rule goes stale.
  ci:
    name: CI
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build and test results
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test:  ${{ needs.test.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
